[project]
name = "private-vpn-bot"
version = "0.1.0"
description = "Private Telegram interface for existing 3x-ui clients"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram>=3.22,<4",
  "fastapi>=0.158.1",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.2,<4",
  "qrcode[pil]>=8.2,<9",
  "vercel-queue>=0.9.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.vercel]
entrypoint = "vpnbot.web:app"

[[tool.vercel.subscribers]]
entrypoint = "vpnbot.cloud"
